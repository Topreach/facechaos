plugins { id 'com.android.application' }
def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('release-signing/upload.properties')
if (uploadPropertiesFile.isFile()) uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease', 'validateSigningRelease'] } && !uploadPropertiesFile.isFile()) {
        throw new GradleException('Upload signing is missing. Restore release-signing/upload.properties and its keystore; do not replace an existing upload identity.')
    }
}
android {
    namespace 'com.facechaos.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.facechaos.mobile'
        minSdk 26
        targetSdk 36
        versionCode 57
        versionName '0.21.0-setup.3'
        testInstrumentationRunner 'com.facechaos.mobile.SceneCheck'
    }
    signingConfigs {
        upload {
            if (uploadPropertiesFile.isFile()) {
                storeFile rootProject.file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            // Collect symbols when dependency vendors supply unstripped libraries.
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.upload
        }
        if (project.hasProperty('optimizedCheck')) {
            verification {
                initWith release
                applicationIdSuffix '.verify'
                versionNameSuffix '-verification'
                signingConfig signingConfigs.debug
                matchingFallbacks = ['release']
            }
        }
    }
    if (project.hasProperty('optimizedCheck')) {
        sourceSets.verification.assets.srcDirs += ['src/androidTest/assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Keep every supported translation available for offline and immediate switching.
    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    // Play Services brings Fragment 1.1.0 transitively; select the maintained release.
    implementation "androidx.fragment:fragment:1.9.1"
    // Align legacy jdk7/jdk8 stdlib modules from vision dependencies with Billing.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "com.google.mediapipe:tasks-vision:0.10.32"
    implementation "com.android.billingclient:billing:9.1.0"
}
